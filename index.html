<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주택담보대출 금리 계산기</title>
<style>
body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f5f7fb;margin:0;padding:20px;color:#182235}
main{max-width:600px;margin:auto;background:white;border-radius:18px;padding:25px;box-shadow:0 5px 25px #0001}
h1{font-size:25px}label{display:block;margin-top:18px;margin-bottom:7px;font-weight:bold}
input,select{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #ccd3dd;border-radius:8px}
.result{background:#edf3ff;border-radius:12px;padding:20px;margin-top:25px}
.big{font-size:30px;color:#2256bd;font-weight:bold;margin:12px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #d4dff3}
small{display:block;color:#667085;line-height:1.6;margin-top:18px}
</style>
</head>
<body><main>
<h1>🏠 주택담보대출 금리 계산기</h1>
<p>대출 조건을 입력하면 월 상환액과 총이자를 계산합니다.</p>
<label>대출금액 (만원)</label><input id="amount" type="number" min="0" value="30000">
<label>연 이자율 (%)</label><input id="rate" type="number" min="0" step="0.01" value="5.11">
<label>대출기간</label><select id="years"><option>10</option><option>20</option><option selected>30</option><option>40</option></select>
<label>상환 방식</label><select id="method"><option value="equal">원리금균등상환</option><option value="principal">원금균등상환</option><option value="interest">만기일시상환</option></select>
<div class="result">
<div id="label">매월 원리금</div><div class="big" id="monthly"></div>
<div class="line"><span>총 예상 이자</span><strong id="interest"></strong></div>
<div class="line"><span>총 상환액</span><strong id="total"></strong></div>
</div>
<small>※ 금리가 만기까지 동일하다는 가정입니다. 원금균등은 첫 달 납입액, 만기일시는 매월 이자를 표시합니다. 실제 대출 조건에 따라 차이가 있습니다.</small>
</main>
<script>
const get=id=>document.getElementById(id);
const money=x=>Math.round(x).toLocaleString('ko-KR')+'원';
function calculate(){
const p=Number(get('amount').value)*10000;
const r=Number(get('rate').value)/1200;
const n=Number(get('years').value)*12;
const type=get('method').value;
if(p<0||r<0||!Number.isFinite(p)||!Number.isFinite(r))return;
let monthly,interest;
if(type==='equal'){
monthly=r===0?p/n:p*r/(1-Math.pow(1+r,-n));
interest=monthly*n-p;
get('label').textContent='매월 원리금';
}else if(type==='principal'){
monthly=p/n+p*r;
interest=p*r*(n+1)/2;
get('label').textContent='첫 달 원리금';
}else{
monthly=p*r;
interest=monthly*n;
get('label').textContent='매월 이자 (만기 원금 별도)';
}
get('monthly').textContent=money(monthly);
get('interest').textContent=money(Math.max(0,interest));
get('total').textContent=money(p+Math.max(0,interest));
}
['amount','rate','years','method'].forEach(id=>get(id).addEventListener('input',calculate));
calculate();
</script>
</body></html>
